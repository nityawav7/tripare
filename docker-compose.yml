version: '3.8'

services:
  # Redis service for caching and Sorted Set price filtering
  redis:
    image: redis:7-alpine
    container_name: hotel-orchestrator-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Temporal standalone server (with auto-setup SQLite)
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: hotel-orchestrator-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
      - SQLITE_DB_PATH=/etc/temporal/config/temporal.db
      - ENABLE_ES=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:latest
    container_name: hotel-orchestrator-temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  # Hotel Offer Orchestrator API & Worker
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-orchestrator-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_TTL=3600
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-orchestration-queue
      - SUPPLIER_A_URL=http://app:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://app:3000/supplierB/hotels
      - START_WORKER=true
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped
